services:
  - type: web
    name: abu-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PANEL_TOKEN
        generateValue: true
      - key: REFERRAL_BONUS_ABU_F
        value: "50"
      - key: DATABASE_URL
        fromDatabase:
          name: abu-db
          property: connectionString
databases:
  - name: abu-db
    plan: free
